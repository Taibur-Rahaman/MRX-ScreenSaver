name: Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    name: Android .apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release APK
        working-directory: android
        run: |
          GRADLE_VER=8.7
          if [[ ! -x gradlew ]]; then
            curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-${GRADLE_VER}/bin/gradle wrapper --gradle-version "$GRADLE_VER"
          fi
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      - name: Package zip
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/*.apk release-assets/MRXScreenSaver-Android.apk
          cp scripts/android/README-Android.txt release-assets/README-Android.txt
          cd release-assets
          zip MRXScreenSaver-Android.zip MRXScreenSaver-Android.apk README-Android.txt
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            release-assets/MRXScreenSaver-Android.apk
            release-assets/MRXScreenSaver-Android.zip
            release-assets/README-Android.txt

  publish-android:
    name: Attach Android to Release
    needs: android-apk
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              artifacts/MRXScreenSaver-Android.apk \
              artifacts/MRXScreenSaver-Android.zip \
              artifacts/README-Android.txt \
              --clobber
          fi
