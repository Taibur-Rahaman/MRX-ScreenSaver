name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild assets for (e.g. v0.1.8)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  macos-saver:
    name: macOS .saver
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install & build frontend
        run: |
          npm ci
          npm run build

      - name: Build native .saver
        run: bash scripts/build-macos-saver.sh

      - name: Package macOS zip (saver + installer)
        run: |
          mkdir -p release-assets/macos-pkg release-assets
          cp -R macos/MRXScreenSaver.saver release-assets/macos-pkg/
          cp scripts/macos/Install-MRX-ScreenSaver.command release-assets/macos-pkg/
          cp scripts/macos/README-macOS.txt release-assets/macos-pkg/
          chmod +x release-assets/macos-pkg/Install-MRX-ScreenSaver.command
          xattr -cr release-assets/macos-pkg/MRXScreenSaver.saver
          codesign --force --sign - --timestamp=none \
            release-assets/macos-pkg/MRXScreenSaver.saver/Contents/MacOS/MRXScreenSaver
          codesign --force --deep --sign - --timestamp=none \
            release-assets/macos-pkg/MRXScreenSaver.saver
          cd release-assets/macos-pkg
          zip -r ../MRXScreenSaver-macOS.zip . -x "*.DS_Store"
          cd ..
          # Standalone installer (same folder layout: run from dir containing .saver)
          cp macos-pkg/Install-MRX-ScreenSaver.command Install-MRX-ScreenSaver.command
          cp macos-pkg/README-macOS.txt README-macOS.txt
          unzip -l MRXScreenSaver-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-saver
          path: |
            release-assets/MRXScreenSaver-macOS.zip
            release-assets/Install-MRX-ScreenSaver.command
            release-assets/README-macOS.txt

  windows-scr:
    name: Windows .scr
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Install Tauri CLI
        run: npm install -D @tauri-apps/cli@2

      - name: Build Tauri (Windows)
        run: npx tauri build
        env:
          CI: true

      - name: Create .scr + Windows zip
        shell: bash
        run: |
          mkdir -p release-assets
          EXE=""
          for candidate in \
            src-tauri/target/release/MRXScreenSaver.exe \
            src-tauri/target/release/mrx-screensaver.exe \
            src-tauri/target/release/app.exe
          do
            if [[ -f "$candidate" ]]; then
              EXE="$candidate"
              break
            fi
          done
          if [[ -z "$EXE" ]]; then
            EXE="$(find src-tauri/target/release -maxdepth 1 -name '*.exe' | head -n 1 || true)"
          fi
          if [[ -z "$EXE" || ! -f "$EXE" ]]; then
            echo "No exe found under target/release:"
            ls -la src-tauri/target/release || true
            find src-tauri/target -name '*.exe' | head -50
            exit 1
          fi
          echo "Using $EXE"
          cp "$EXE" release-assets/MRXScreenSaver.scr
          cp scripts/windows/Install.bat release-assets/
          cp scripts/windows/README-Windows.txt release-assets/README.txt
          cp scripts/windows/Open-Screen-Saver-Settings.bat release-assets/
          cp scripts/windows/Uninstall.bat release-assets/
          (
            cd release-assets
            powershell -Command "Compress-Archive -Path MRXScreenSaver.scr,Install.bat,README.txt,Open-Screen-Saver-Settings.bat,Uninstall.bat -DestinationPath MRXScreenSaver-Windows.zip -Force"
          )
          ls -la release-assets/

      - uses: actions/upload-artifact@v4
        with:
          name: windows-scr
          path: |
            release-assets/MRXScreenSaver.scr
            release-assets/MRXScreenSaver-Windows.zip
            release-assets/Install.bat
            release-assets/README.txt

            release-assets/README.txt

  linux-saver:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install frontend deps
        run: npm ci

      - name: Install Tauri CLI
        run: npm install -D @tauri-apps/cli@2

      - name: Build Tauri (Linux)
        run: npx tauri build --bundles appimage
        env:
          CI: true

      - name: Package Linux zip
        run: |
          mkdir -p release-assets/linux-pkg release-assets
          BIN=""
          for candidate in \
            src-tauri/target/release/MRXScreenSaver \
            src-tauri/target/release/mrx-screensaver
          do
            if [[ -f "$candidate" ]]; then
              BIN="$candidate"
              break
            fi
          done
          if [[ -z "$BIN" ]]; then
            BIN="$(find src-tauri/target/release -maxdepth 1 -type f -executable ! -name '*.so' | head -n 1 || true)"
          fi
          APPIMAGE="$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' 2>/dev/null | head -n 1 || true)"
          if [[ -n "$BIN" && -f "$BIN" ]]; then
            cp "$BIN" release-assets/linux-pkg/MRXScreenSaver
            chmod +x release-assets/linux-pkg/MRXScreenSaver
          fi
          if [[ -n "$APPIMAGE" && -f "$APPIMAGE" ]]; then
            cp "$APPIMAGE" release-assets/linux-pkg/
          fi
          cp scripts/linux/install.sh release-assets/linux-pkg/
          cp scripts/linux/uninstall.sh release-assets/linux-pkg/
          cp scripts/linux/configure-xscreensaver.sh release-assets/linux-pkg/
          cp scripts/linux/README-Linux.txt release-assets/linux-pkg/README.txt
          chmod +x release-assets/linux-pkg/*.sh
          (cd release-assets/linux-pkg && zip -r ../MRXScreenSaver-Linux.zip .)
          ls -la release-assets/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-saver
          path: |
            release-assets/MRXScreenSaver-Linux.zip
            release-assets/linux-pkg/README.txt

  publish:
    name: Attach to GitHub Release
    needs: [macos-saver, windows-scr, linux-saver]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets
        run: |
          mkdir -p release-assets
          cp artifacts/macos-saver/MRXScreenSaver-macOS.zip release-assets/
          cp artifacts/macos-saver/Install-MRX-ScreenSaver.command release-assets/ || \
            cp scripts/macos/Install-MRX-ScreenSaver.command release-assets/
          cp artifacts/macos-saver/README-macOS.txt release-assets/ || \
            cp scripts/macos/README-macOS.txt release-assets/
          cp artifacts/windows-scr/MRXScreenSaver.scr release-assets/
          cp artifacts/windows-scr/MRXScreenSaver-Windows.zip release-assets/ || true
          cp artifacts/linux-saver/MRXScreenSaver-Linux.zip release-assets/ || true
          ls -la release-assets/
          unzip -l release-assets/MRXScreenSaver-macOS.zip | head -20

      - name: Resolve tag
        id: tag
        run: |
          if [[ -n "${{ github.event.inputs.tag }}" ]]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes-file - <<'EOF'
          ## Assets
          - **MRXScreenSaver-macOS.zip** — macOS native `.saver` + installer
          - **MRXScreenSaver-Windows.zip** — Windows `.scr` + Install.bat
          - **MRXScreenSaver-Linux.zip** — Linux AppImage/binary + install scripts
          - **MRXScreenSaver.scr** — Windows screensaver binary
          - **Web demo** — https://taibur-rahaman.github.io/MRX-ScreenSaver/?scene=flipclock

          ### macOS
          1. Download **MRXScreenSaver-macOS.zip**
          2. Unzip → double-click **Install-MRX-ScreenSaver.command**
          3. System Settings → Screen Saver → MRX ScreenSaver → Preview

          ### Windows
          1. Download **MRXScreenSaver-Windows.zip** and unzip
          2. Right-click **Install.bat** → **Run as administrator**
          3. Classic Screen Saver dialog (`control desk.cpl,,1`) → MRXScreenSaver → Preview

          ### Linux / Ubuntu
          1. Download **MRXScreenSaver-Linux.zip** and unzip
          2. Run `bash install.sh`
          3. Run `mrx-screensaver` or configure XScreenSaver with `bash configure-xscreensaver.sh`

          ### Web (no install)
          Open the [live flip clock demo](https://taibur-rahaman.github.io/MRX-ScreenSaver/?scene=flipclock)
          EOF
          fi
          gh release upload "$TAG" \
            release-assets/MRXScreenSaver-macOS.zip \
            release-assets/Install-MRX-ScreenSaver.command \
            release-assets/README-macOS.txt \
            release-assets/MRXScreenSaver.scr \
            release-assets/MRXScreenSaver-Windows.zip \
            release-assets/MRXScreenSaver-Linux.zip \
            --clobber
          echo "Uploaded to https://github.com/${{ github.repository }}/releases/tag/$TAG"
