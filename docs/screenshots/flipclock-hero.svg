<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">MRX ScreenSaver  Flip Clock</title>
  <desc id="desc">Flipqlo-style flip clock screensaver preview on dark background</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <text x="600" y="90" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="42" font-weight="600" fill="#E0E0E0" letter-spacing="8">MRX ScreenSaver</text>
  <text x="600" y="135" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="22" fill="#888" letter-spacing="4">FLIPQLO-STYLE FLIP CLOCK</text>
  <g transform="translate(600 340)" filter="url(#shadow)">
  <g transform="translate(-280 0)">
    <rect x="-48" y="-72" width="96" height="144" rx="6" fill="#1C1C1C" stroke="#252525"/>
    <text x="0" y="18" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="72" font-weight="500" fill="#E0E0E0">1</text>
    <line x1="-48" y1="0" x2="48" y2="0" stroke="#0F0F0F" stroke-width="2"/>
  </g>
  <g transform="translate(-140 0)">
    <rect x="-48" y="-72" width="96" height="144" rx="6" fill="#1C1C1C" stroke="#252525"/>
    <text x="0" y="18" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="72" font-weight="500" fill="#E0E0E0">0</text>
    <line x1="-48" y1="0" x2="48" y2="0" stroke="#0F0F0F" stroke-width="2"/>
  </g>
  <text x="0" y="18" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="48" fill="#3A3A3A">:</text>
  <g transform="translate(140 0)">
    <rect x="-48" y="-72" width="96" height="144" rx="6" fill="#1C1C1C" stroke="#252525"/>
    <text x="0" y="18" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="72" font-weight="500" fill="#E0E0E0">4</text>
    <line x1="-48" y1="0" x2="48" y2="0" stroke="#0F0F0F" stroke-width="2"/>
  </g>
  <g transform="translate(280 0)">
    <rect x="-48" y="-72" width="96" height="144" rx="6" fill="#1C1C1C" stroke="#252525"/>
    <text x="0" y="18" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="72" font-weight="500" fill="#E0E0E0">2</text>
    <line x1="-48" y1="0" x2="48" y2="0" stroke="#0F0F0F" stroke-width="2"/>
  </g>
  </g>
  <text x="600" y="520" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="20" fill="#666" letter-spacing="6">WINDOWS · macOS · LINUX · WEB</text>
</svg>
